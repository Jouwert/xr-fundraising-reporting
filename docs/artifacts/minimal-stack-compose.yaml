version: "3.8"

services:
  db:
    image: postgres:15
    container_name: fundraising_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  metabase:
    image: metabase/metabase:latest
    container_name: fundraising_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${PG_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${PG_USER}
      MB_DB_PASS: ${PG_PASS}
      MB_DB_HOST: db
      MB_SECRET_KEY: ${METABASE_SECRET_KEY}
    depends_on:
      - db
    volumes:
      - metabase_app_data:/metabase-data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fundraising_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - metabase

volumes:
  postgres_data:
  metabase_app_data:
